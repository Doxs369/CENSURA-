<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MultyEye Mobile</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Carichiamo le librerie IA di Google (MediaPipe) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="app-container">
        <!-- Schermata Iniziale (Connessione) -->
        <div id="setup-screen">
            <h1>MultyEye</h1>
            <p>Inserisci l'IP del PC (es. 192.168.1.50)</p>
            <input type="text" id="ip-input" placeholder="192.168.1.XXX" value="">
            <button id="start-btn">CONNETTI E AVVIA</button>
            <p id="status-text">Stato: Disconnesso</p>
        </div>

        <!-- Schermata Videocamera (Nascosta all'inizio) -->
        <div id="camera-screen" style="display: none;">
            <video id="webcam" autoplay playsinline style="display:none;"></video>
            <canvas id="output-canvas"></canvas>
            
            <!-- Pannello di controllo sovrapposto -->
            <div id="overlay-controls">
                <div id="current-mode">Modalità: Occhi</div>
                <button id="stop-btn">STOP</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
