<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MultyEye Mobile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="app-container">
        <div id="setup-screen">
            <h1>MultyEye</h1>
            <p>Ricerca del PC in corso...</p>
            <div id="scan-status">Scansione della rete locale in corso...</div>
            <div id="device-list" style="display:none;">
                <p>PC trovati:</p>
                <ul id="device-ul" style="list-style: none; padding: 0;"></ul>
            </div>
            <p id="status-text">Stato: In attesa</p>
        </div>

        <div id="camera-screen" style="display: none;">
            <video id="webcam" autoplay playsinline style="display:none;"></video>
            <canvas id="output-canvas"></canvas>
            <div id="overlay-controls">
                <div id="current-mode">Modalità: Occhi</div>
                <button id="stop-btn">STOP</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
